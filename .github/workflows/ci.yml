name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, import, offline eval)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff==0.8.6

      - name: Lint
        run: ruff check .

      - name: Import the app (catches wiring errors)
        run: python -c "from app.main import app; print(app.title, app.version)"

      - name: Offline evaluation
        # No API keys and no database: exercises the deterministic path end to end
        # and fails if the scorer stops ranking labelled pairs correctly.
        run: |
          python -m eval.run_eval --no-llm --out eval/ci-results.json
          python - <<'PY'
          import json, sys
          summary = json.load(open("eval/ci-results.json"))["summary"]
          print(json.dumps(summary, indent=2))
          floor = {"spearman_semantic_vs_human": 0.85, "pairwise_ranking_accuracy": 0.75}
          for key, minimum in floor.items():
              if summary[key] < minimum:
                  sys.exit(f"regression: {key}={summary[key]} < {minimum}")
          PY

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: backend/eval/ci-results.json

  docker:
    name: Backend image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: fitscope-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot the container and check /health
        run: |
          docker run -d --name fitscope -p 8000:8000 -e PORT=8000 fitscope-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          docker rm -f fitscope

  frontend:
    name: Frontend (types, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://fitscope-api.onrender.com
